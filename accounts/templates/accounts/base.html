<!doctype html>
{% load static %}
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MathTutor AI{% endblock %}</title>
    <link
        rel="stylesheet"
        href="{% static 'accounts/vendor/bootstrap-5.3.8.min.css' %}?v=interfaz2">
    <link rel="stylesheet" href="{% static 'accounts/app.css' %}?v=encuadre1">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="card app-shell border-0 shadow-sm mx-auto">
            <div class="card-body p-4">
                <h1 class="h3 text-primary mb-4">MathTutor AI</h1>
                {% block content %}{% endblock %}
            </div>
        </div>
    </main>
</body>
</html>
